apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app
  labels:
    app: node-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
        role: app
    spec:
      containers:
      - name: node-app
        image: "makenmohamed/url-shortener:latest"
        ports:
        - containerPort: 3000
      nodeSelector:
        role: app
